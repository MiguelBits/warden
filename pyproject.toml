[project]
name = "warden"
version = "0.1.0"
description = "Grounded household scam triage with bounded tool use"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MiguelBits" }]
dependencies = []

[project.scripts]
warden = "warden.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
