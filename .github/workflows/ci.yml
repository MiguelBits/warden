name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests and the verdict gate
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check the control-plane worker parses
        run: node --check cloud/src/worker.js
